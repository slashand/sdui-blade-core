name: Publish to NPM

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify stable release tag and package identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release.mjs "$RELEASE_TAG"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Matrix
        run: npm test

      - name: Build Package
        run: npm run build --if-present

      - name: Publish to NPM (Stable)
        run: npm publish --access public --tag latest --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_SDUI_BLADE }}
